# Place under nu's default scripts dir so `use community/...` resolves via NU_LIB_DIRS.
#
# Pinned to a revision so the tree is deterministic: upstream tracks the newest
# nushell release while nixpkgs holds nu still for a release cycle, so main can
# carry syntax the local nu rejects, and the daily refresh would walk it onto the
# machine between runs. The pin is also what makes the nushell CI job a gate — it
# parses the imported modules at this exact sha. The nu-scripts-pin workflow
# proposes the bump once that gate passes against a newer revision.
# `git clone --revision` needs git 2.49+; naming the same sha in pull.args is what
# holds a clone that was made from a branch, and stops `apploi -R` fast-forwarding
# off the pin.
["Library/Application Support/nushell/scripts/community"]
type = "git-repo"
url = "https://github.com/nushell/nu_scripts.git"
refreshPeriod = "24h"
clone.args = ["--revision", "381eb7577705b00bea437da7c0439c39ff05f06b", "--depth", "1"]
pull.args = ["--ff-only", "origin", "381eb7577705b00bea437da7c0439c39ff05f06b"]

# GitHub authors this skill next to the `gh stack` CLI it documents, so it tracks
# the default branch rather than a release tag: the extension upgrades on every
# switch (the ghStackExtension activation), and a pinned skill would describe a
# CLI the machine has already moved past. Weekly is often enough for docs.
# include matches the archive's own member paths, so the leading `*` stands in for
# the tarball's top-level directory that stripComponents then removes.
[".claude/skills/gh-stack"]
type = "archive"
url = "https://github.com/github/gh-stack/archive/refs/heads/main.tar.gz"
refreshPeriod = "168h"
stripComponents = 3
include = ["*/skills/gh-stack/**"]
