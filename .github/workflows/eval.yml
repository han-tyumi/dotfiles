name: eval fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [test-minimal, test-personal, test-all]
    defaults:
      run:
        working-directory: dot_config/nix-darwin
    steps:
      - uses: actions/checkout@v4

      # machine.nix is chezmoi-rendered per host, so a bare checkout lacks it.
      # Nix only copies git-tracked files of a git worktree into the store, so
      # the synthesized file must be staged to be visible to the flake.
      - name: Synthesize machine.nix
        run: |
          cat > machine.nix << 'EOF'
          {
            hostname = "ci";
            username = "runner";
            nixbldGid = 350;
            appStore = false;
            layers = [ ];
          }
          EOF
          git add machine.nix

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Evaluate ${{ matrix.fixture }}
        run: nix eval --no-write-lock-file ".#darwinConfigurations.${{ matrix.fixture }}.system.drvPath"

  # Nushell resolves `use` at parse time and home-manager copies config.nu into
  # the store unparsed, so a parse error — in a first-party script or in the
  # pinned nu_scripts external — only surfaces at shell start. Parse every nu
  # source with the nushell of the flake's own nixpkgs, against the external at
  # the revision .chezmoiexternals pins, so both classes fail here instead.
  nushell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      # Reproduce the runtime layout the imports resolve against: community/ is
      # the external, and commands/*.nu are symlinks to the ~/.local/bin CLIs.
      - name: Assemble the nushell lib dir
        run: |
          scripts="private_Library/private_Application Support/private_nushell/scripts"
          sha=$(sed -n 's/.*"--revision", "\([0-9a-f]\{40\}\)".*/\1/p' .chezmoiexternals/shared.toml)
          git init -q "$scripts/community"
          git -C "$scripts/community" fetch -q --depth 1 https://github.com/nushell/nu_scripts.git "$sha"
          git -C "$scripts/community" checkout -q FETCH_HEAD
          for cli in "$scripts"/commands/symlink_*.nu.tmpl; do
            name=$(basename "$cli" .nu.tmpl)
            name=${name#symlink_}
            ln -s "$PWD/private_dot_local/bin/executable_$name" "$scripts/commands/$name.nu"
          done

      - name: Resolve the pinned nushell
        run: |
          nu=$(nix build --no-link --print-out-paths --inputs-from ./dot_config/nix-darwin nixpkgs#nushell)
          echo "NU=$nu/bin/nu" >> "$GITHUB_ENV"

      # nu-check exits non-zero on a parse error; bare nu-check only prints false.
      - name: Parse every nu source
        run: |
          scripts="private_Library/private_Application Support/private_nushell/scripts"
          autoload="private_Library/private_Application Support/private_nushell/autoload"
          files=(dot_config/nix-darwin/nushell/config.nu "$scripts/commands/mod.nu" "$autoload"/*.nu)
          while IFS= read -r cli; do
            files+=("$cli")
          done < <(grep -l '^#!/usr/bin/env nu' private_dot_local/bin/executable_*)
          failed=0
          for file in "${files[@]}"; do
            # 30-mise.nu imports the module config.nu generates at runtime, which
            # no checkout has.
            if [[ $file == */30-mise.nu ]]; then
              continue
            fi
            if "$NU" --no-config-file -I "$scripts" -c "nu-check --debug \"$file\"" > /dev/null; then
              echo "ok   $file"
            else
              echo "FAIL $file"
              failed=1
            fi
          done
          exit $failed

  # The Windows profile has no Nix fixture to eval; validate its templates,
  # manifests, and provisioner scripts instead — including a Windows PowerShell
  # 5.1 parse to guard the documented first-apply-safety invariant (pwsh 7 is
  # absent on the first apply, so the provisioners must parse under 5.1).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        shell: pwsh
        run: choco install chezmoi --yes --no-progress

      - name: Validate JSON manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content dot_config/winget/packages.json -Raw | Test-Json | Out-Null
          # Windows Terminal settings is JSONC (create_, write-once); drop // line comments before Test-Json.
          $wt = 'AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/create_settings.json'
          (((Get-Content $wt) -notmatch '^\s*//') -join "`n") | Test-Json | Out-Null

      - name: Render managed templates as os = windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # init writes a config with the layer data the templates read; apply
          # --dry-run then renders every managed template under os=windows,
          # respecting .chezmoiignore. It runs no scripts and changes nothing, but
          # errors on any template failure.
          chezmoi init --source "$PWD" --promptString "layers=personal" --promptString "overlays="
          if ($LASTEXITCODE) { throw "chezmoi init failed" }
          $out = chezmoi --source "$PWD" apply --dry-run --force 2>&1
          if ($LASTEXITCODE) { $out; throw "template render failed" }

      - name: Render provisioner scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path rendered | Out-Null
          Get-ChildItem -Recurse -Filter *.ps1.tmpl | ForEach-Object {
            $name = $_.Name -replace '\.tmpl$', ''
            $rendered = & chezmoi --source "$PWD" execute-template (Get-Content $_.FullName -Raw)
            # A failed render must fail the job, not write an empty file that
            # vacuously passes PSScriptAnalyzer and the 5.1 parse.
            if ($LASTEXITCODE) { throw "execute-template failed for $($_.Name)" }
            $rendered | Set-Content "rendered/$name"
          }
          Get-ChildItem -Filter *.ps1 | ForEach-Object { Copy-Item $_.FullName "rendered/$($_.Name)" }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $res = Invoke-ScriptAnalyzer -Path rendered -Severity Error
          $res | Format-Table -AutoSize
          if ($res) { throw "PSScriptAnalyzer found $($res.Count) error(s)." }

      - name: Parse first-apply scripts under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Only the scripts chezmoi runs during apply on a fresh box (the
          # provisioners + bootstrap) must parse under 5.1; the interactive pwsh 7
          # profile is loaded only once pwsh 7 is present, so it is exempt.
          $bad = @()
          Get-ChildItem rendered -Filter *.ps1 |
            Where-Object { $_.Name -ne 'Microsoft.PowerShell_profile.ps1' } |
            ForEach-Object {
              $errs = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
              if ($errs) { $bad += $_.Name; $errs | ForEach-Object { Write-Host $_ } }
            }
          if ($bad.Count) { throw "Windows PowerShell 5.1 parse errors in: $($bad -join ', ')" }
